name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22" # the suite installs and wires the first-party MCPs, whose floor is 22.17
          cache: npm
      - run: npm ci
      # The suite exercises installing MCP config, which now refuses to wire a server whose binary is
      # absent — so the environment must actually contain the MCPs it wires, as a user's would.
      - run: npm run install:mcps
      # The opt-in cybersecurity MCPs the suite wires include openosint, whose prerequisites are uv
      # and its provider extras. Establish them through agent-surface's own provisioning (-y), which
      # also exercises the real recipe path — uv standalone installer, then `uv tool install` — on a
      # machine that has neither.
      - name: establish external MCP prerequisites (real provisioning run)
        run: node scripts/agent-surface.mjs install --target droid --dest "$RUNNER_TEMP/prep" --category mcps --service openosint -y
      - run: npm run check
      - run: npm run check:commands
      - run: npm run check:generated
      - run: npm run check:rules
      - run: npm test
      - run: npm run build -- --target all
      - run: npm pack --dry-run --json

  # The root CLI declares engines.node >=20.12; keep proving the compiler itself runs on that floor
  # even though the MCP packages (and therefore the install suite) require 22.17.
  floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.12"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build -- --target all

  # Native Windows acceptance. The Windows launch path cannot be proven from POSIX: batch-shim
  # spawning, PATHEXT resolution and the node.exe wrapper are all decided by the OS, so this job runs
  # the real installer and then launches the EXACT command it generated under a minimal PATH.
  # The full suite is not run here yet: it installs the first-party MCPs, whose installers are POSIX
  # shell scripts. That port is separate work; until then this job proves the launch path.
  windows:
    runs-on: windows-2025
    steps:
      - name: allow long paths (submodule checkout)
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: native launch acceptance (real install -> generated command -> rendered page)
        env:
          AGENT_SURFACE_LIVE_LAUNCH: "1"
        run: node tests/suites/live-launch.test.mjs
      # Closes the other Windows gap: a credentialed external MCP, provisioned from nothing (uv
      # bootstrap -> uv tool install -> extras) and launched with the collected credential.
      - name: native provisioning acceptance (uv bootstrap -> openosint -> credential delivery)
        env:
          AGENT_SURFACE_LIVE_PROVISION: "1"
        run: node tests/suites/live-provision.test.mjs
      # Suites that must hold on every platform: launch-command construction, credential handling
      # (where Windows uses ACLs, not mode bits), and prerequisite detection under PATHEXT.
      # ONE STEP PER SUITE — the shell reports only the LAST command's exit status, so chaining them
      # in a single step would let an earlier failure pass as green.
      - run: node tests/suites/credentials.test.mjs
      - run: node tests/suites/mcp-env-launch.test.mjs
      - run: node tests/suites/mcp-credential-launch.test.mjs
      - run: node tests/suites/provision.test.mjs
      - run: node tests/suites/provision-exec.test.mjs
      - run: node tests/suites/provision-install.test.mjs

  mcp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22" # node:sqlite needs >=22.17
      - name: grimoire (build, tests incl. real-pack eval gate, audit)
        working-directory: mcps/grimoire
        run: |
          npm ci
          npm test
          npm audit --omit=dev
      - name: synapse (build, tests, audit)
        working-directory: mcps/synapse
        run: |
          npm ci
          npm test
          npm audit --omit=dev
